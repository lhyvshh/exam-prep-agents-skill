version: 2
updates:
  - package-ecosystem: uv
    directories:
      - /
      - /skills/producing-exam-prep-packages
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns:
          - "*"
    ignore:
      # Dependabot's uv updater cannot update this package's split Intel macOS marker.
      - dependency-name: pymupdf
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
